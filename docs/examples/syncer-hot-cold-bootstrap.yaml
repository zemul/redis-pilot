# ONE-TIME bootstrap, before allowing Gateway traffic. Wait until the named
# task is ready and applied, then stop gracefully and use syncer-hot-cold.yaml.
mode: isolated
admin_listen: 127.0.0.1:19300
io_timeout: 3s
shutdown_timeout: 10s
tasks:
  - task_id: hotcold-dev-0
    confirm_exclusive_cold: true
    source_address: 127.0.0.1:16390
    cold_address: 127.0.0.1:16666
    journal_dir: /var/lib/redis-pilot-hotcold-syncer/journal
    segment_bytes: 4194304
    journal_bytes: 134217728
    allow_unauthenticated: true

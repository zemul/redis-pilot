# G6a-11 isolated STATIC tasks, not a production Cluster configuration.
# Prepare three dedicated Redis sources and three EMPTY, exclusive Kvrocks DBs.
# These example ports are not deployed. No backend or directory parent is
# created automatically. Do not share any source/cold endpoint between tasks.
mode: isolated
admin_listen: "127.0.0.1:19300"
io_timeout: 30s
shutdown_timeout: 10s

# Optional G6a-13 read-only INFO replication probes; disabled by default.
# Requires named tasks and source credentials with INFO permission.
# Does not authorize cold reads, eviction, warming, or failover.
# progress:
#   enabled: true
#   interval: 5s
#   timeout: 1s

# Optional G6a-12 observation-only reporting; disabled unless explicitly set.
# Server must configure an independent syncer_tokens entry for this stable ID.
# This does not fetch tasks, fence cold writes, or enable automatic failover.
# control_plane:
#   server_endpoint: "https://pilot.internal.example"
#   token_file: "/etc/redis-syncer/server-token"
#   syncer_id: "syncer-dev-01"
#   node_id: "redis01"
#   heartbeat_interval: 10s
#   request_timeout: 3s

# Each ID is stable, non-secret, 1..64 ASCII letters/digits/_/-.
# IDs, canonical backend addresses, and journals are durably bound at creation.
# Do not change an ID or backend address while reusing an existing journal.
# Do not point a named task at a legacy single-task journal, even if empty.
# journal_dir parents must already exist and belong to the service account.
tasks:
  - task_id: shard-a
    confirm_exclusive_cold: true
    source_address: "127.0.0.1:26379"
    cold_address: "127.0.0.1:26666"
    journal_dir: "/var/lib/redis-syncer/shard-a"
    segment_bytes: 4194304
    journal_bytes: 134217728
    allow_unauthenticated: true
  - task_id: shard-b
    confirm_exclusive_cold: true
    source_address: "127.0.0.1:26380"
    cold_address: "127.0.0.1:26667"
    journal_dir: "/var/lib/redis-syncer/shard-b"
    segment_bytes: 4194304
    journal_bytes: 134217728
    allow_unauthenticated: true
  - task_id: shard-c
    confirm_exclusive_cold: true
    source_address: "127.0.0.1:26381"
    cold_address: "127.0.0.1:26668"
    journal_dir: "/var/lib/redis-syncer/shard-c"
    segment_bytes: 4194304
    journal_bytes: 134217728
    allow_unauthenticated: true

# Unauthenticated operation is only an explicit loopback-test opt-in.
# For authenticated tasks, set allow_unauthenticated: false in EACH task and add:
# source_password_file: "/etc/redis-syncer/shard-a-source-password"
# cold_password_file: "/etc/redis-syncer/shard-a-cold-password"
# Files must pass the same owner/0600/regular/single-link checks as G6a-10.
# Do not mix tasks with legacy top-level source/cold/journal/credential/budget
# fields, even if the legacy value is empty, false, or zero.

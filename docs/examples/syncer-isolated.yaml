# G6a-10 isolated prototype only. This is NOT a production Cluster config.
# Prepare a dedicated test Redis and an EMPTY, exclusive Kvrocks cold DB.
# Never point it at an existing business database or share the cold DB with
# another sync task: the prototype uses fixed checkpoint/pending/anchor keys.
# These example ports have NOT been deployed and are separate from Gateway's
# existing 16389 development backend. No backend is created automatically.
mode: isolated
confirm_exclusive_cold: true
source_address: "127.0.0.1:26379"
cold_address: "127.0.0.1:26666"
admin_listen: "127.0.0.1:19300"

# Dedicated durable state, not /tmp (systemd PrivateTmp is enabled).
journal_dir: "/var/lib/redis-syncer/journal"
segment_bytes: 4194304
journal_bytes: 134217728
io_timeout: 30s
shutdown_timeout: 10s

# Unauthenticated connections are permitted only for this loopback test setup.
allow_unauthenticated: true
# For authenticated isolated tests, set false and use protected credential files:
# source_password_file: "/etc/redis-syncer/source-password"
# cold_password_file: "/etc/redis-syncer/cold-password"

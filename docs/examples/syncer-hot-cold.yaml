# Start ONLY after initial named-task capture/bootstrap has completed and stopped.
# Preserve the same task/endpoints/journal. Never bootstrap a lost journal anew.
mode: isolated-confirmation-live
listen: 127.0.0.1:19301
confirm_exclusive_cold: true
confirmation:
  journal_dir: /var/lib/redis-pilot-hotcold-syncer/journal
  operation_dir: /var/lib/redis-pilot-hotcold-syncer/operations
  token_file: /etc/redis-pilot-hotcold/syncer.secret
  allow_unauthenticated: true
  segment_bytes: 4194304
  journal_bytes: 134217728
  timeout: 3s
  binding:
    task_id: hotcold-dev-0
    gateway_id: gateway-redis03-hotcold
    syncer_id: syncer-redis03-hotcold
    source: 127.0.0.1:16390
    cold: 127.0.0.1:16666
    history: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    epoch: 1

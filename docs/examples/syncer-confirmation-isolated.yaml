# Exclusive experiment/recovery mode of redis-syncer, NOT a live task setting.
# Replace every identity/path/history, dedicate the backends, and stop capture
# first. Both operation directories must be private (0700), and distinct.
mode: isolated-confirmation
# To keep capturing while holding/confirming a preparation barrier, use:
# mode: isolated-confirmation-live
# Both variants require exclusive takeover of an EXISTING named capture log.
listen: "127.0.0.1:19301"
confirm_exclusive_cold: true
confirmation:
  binding:
    syncer_id: "syncer-probe"
    gateway_id: "gateway-probe"
    task_id: "shard-probe"
    source: "127.0.0.1:26379"
    cold: "127.0.0.1:26666"
    history: "REPLACE_WITH_CAPTURED_40_CHAR_LOWERCASE_REPLID"
    epoch: 1
  journal_dir: "/var/lib/redis-syncer/probe-source-log"
  operation_dir: "/var/lib/redis-syncer/probe-confirmation"
  token_file: "/etc/redis-syncer/confirmation-token"
  source_password_file: "/etc/redis-syncer/source-password"
  cold_password_file: "/etc/redis-syncer/cold-password"
  allow_unauthenticated: false
  segment_bytes: 4194304
  journal_bytes: 134217728
  timeout: 5s

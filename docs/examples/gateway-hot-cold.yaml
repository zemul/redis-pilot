# Single-shard development deployment; not Cluster. Automatic eviction is opt-in.
# Replace history with the actual source master_replid used by the syncer.
gateway_id: gateway-redis03-hotcold
service_id: hotcold-dev
shard_id: hotcold-dev-0
mode: passthrough
listen: 127.0.0.1:17379
admin_listen: 127.0.0.1:19200
redis_address: 127.0.0.1:16390
state_dir: /var/lib/redis-pilot-hotcold-gateway/state
# Dedicated local development backends only; frontend remains authenticated.
allow_unauthenticated: true
frontend_password_file: /etc/redis-pilot-hotcold/frontend.secret
connect_timeout: 3s
request_timeout: 5s
shutdown_timeout: 10s
max_connections: 8
max_pipeline: 8
max_batch_bytes: 262144
buffer_budget_bytes: 67108864
limits:
  max_bytes: 262144
  max_elements: 4096
  max_depth: 32
hot_cold:
  auto_eviction:
    enabled: false
    high_watermark: 0.80
    low_watermark: 0.70
    interval: 5s
    batch_timeout: 3s
    sample_count: 64
    max_keys_per_batch: 4
    min_idle: 1m
    # MEMORY USAGE threshold, not String length; short keys only (<=256 bytes).
    min_memory_bytes: 8192
    max_sync_lag_bytes: 1048576
  confirm_exclusive_hot: true
  timeout: 3s
  syncer_endpoint: http://127.0.0.1:19301
  syncer_token_file: /etc/redis-pilot-hotcold/gateway-syncer.secret
  admin_token_file: /etc/redis-pilot-hotcold/admin.secret
  binding:
    task_id: hotcold-dev-0
    gateway_id: gateway-redis03-hotcold
    syncer_id: syncer-redis03-hotcold
    source: 127.0.0.1:16390
    cold: 127.0.0.1:16666
    history: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    epoch: 1

node:
  id: redis-pilot-envoy
  cluster: redis-pilot

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

dynamic_resources:
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    grpc_services:
      - envoy_grpc:
          cluster_name: redis-pilot-xds
          # 若 redis-pilot-xds 配置了 auth_token，取消注释并填入相同的 token，
          # 否则 ADS 连接会被 xDS 服务的鉴权拦截器拒绝（S7：xDS 默认无鉴权、
          # snapshot 内含明文 Redis 密码，需要与 Server/Agent 同等的 Bearer Token 保护）。
          # initial_metadata:
          #   - key: authorization
          #     value: "Bearer <auth_token>"
  cds_config:
    ads: {}
    resource_api_version: V3
  lds_config:
    ads: {}
    resource_api_version: V3

static_resources:
  clusters:
    - name: redis-pilot-xds
      type: STRICT_DNS
      connect_timeout: 1s
      http2_protocol_options: {}
      load_assignment:
        cluster_name: redis-pilot-xds
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: redis-pilot-xds
                      port_value: 18000


port: 8080
data_dir: /opt/redis-pilot-server/state

# JWT 签名密钥，为空则使用内置默认值（仅限本地开发；生产环境务必显式配置）
jwt_secret: ""

# 内部组件通信 token：Proxy 拉取快照时携带，须与 proxy.yaml 的 server_token 一致
# 为空则跳过校验（快照含实例地址与密码，生产环境务必配置）
internal_token: ""

# Proxy 对外暴露的域名/IP（不含端口）。由 Server 统一管理并通过快照
# （/api/v1/proxy/snapshot）下发给 Proxy（用作伪 Sentinel 应答 host）和
# Dashboard（拼接展示完整连接地址 <proxy_public_endpoint>:<port>）。
# Proxy 侧不提供本地配置项，完全依赖此值，不做兜底或覆盖；
# 为空则 Proxy 退化为用连接命中的本地 IP，Dashboard 仅展示端口。
proxy_public_endpoint: ""

# 初始管理员账号（仅首次启动、users 表为空时生效）
admin:
  username: admin
  password: admin

# 端口分配范围
ports:
  redis:
    start: 6379
    end: 6499
  proxy_auto:
    start: 16379
    end: 16499
  proxy_master:
    start: 16500
    end: 16619

# 实例版本目录由 Server 统一维护，Agent 只执行 Server 下发的镜像
images:
  redis:
    default: "7"
    versions:
      "5": docker.io/redis:5
      "6.2": docker.io/redis:6.2
      "7": docker.io/redis:7
  kvrocks:
    default: "2.15.0"
    versions:
      "2.15.0": docker.io/apache/kvrocks:2.15.0

sentinel:
  enabled: true
  # Sentinel 是 HA 控制面，生产环境必须提前规划并显式声明节点。
  # 节点名必须来自 pool-state.yaml 的 servers key，建议 3 或 5 个，跨可用区部署。
  nodes: []
  replicas: 3
  port: 26379
  quorum: 2
  down_after_milliseconds: 5000
  failover_timeout: 30000
  parallel_syncs: 1

log:
  dir: /data/logs/redis-pilot-server    # 为空则不写文件
  stdout: true
  retention_days: 30                    # 日志保留天数，0 = 不清理

# 内嵌式 AI 运维助手（可选，默认关闭）。详见 docs/architecture/ai-assistant.md。
# 对接任意 OpenAI 兼容接口（OpenAI / 通义千问 / DeepSeek / 本地 vLLM 等）。
ai:
  enabled: false                        # 总开关；true 时才初始化助手并挂载 /api/v1/ai/chat
  base_url: ""                          # OpenAI 兼容接口地址，如 https://.../v1
  # 密钥：强烈建议用 ${ENV_VAR} 从环境变量注入，不要明文写入配置文件。
  # 启动时通过 os.ExpandEnv 展开，例如导出 AGP_API_KEY 后填 "${AGP_API_KEY}"。
  api_key: "${AI_API_KEY}"
  model: ""                             # 模型名（可带 provider 前缀，如 volcengine/deepseek-v4-flash）
  skills_dir: ""                        # 空=用内嵌 skill 副本；填目录路径=从磁盘读取（开发热更）
  max_turns: 100                        # 工具调用循环轮数上限（防失控），默认 8
  max_tokens: 2048                      # 单次回复 token 上限，默认 2048
  history_summary_threshold: 20         # 对话消息数超过该值时，把早期消息压缩成一条摘要（0=用默认20）
  history_summary_keep: 6               # 压缩时保留的最近消息条数（原文不动），默认 6
  timeout: 120s                         # 单次对话总超时，默认 120s
  allow_write: false                    # 是否允许写操作工具（MVP 只读，保持 false）

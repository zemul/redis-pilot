port: 8080
data_dir: /opt/redis-pilot-server/state

# JWT 签名密钥，为空则使用内置默认值（仅限本地开发；生产环境务必显式配置）
jwt_secret: ""

# 内部组件通信 token：Proxy 拉取快照时携带，须与 proxy.yaml 的 server_token 一致
# 为空则跳过校验（快照含实例地址与密码，生产环境务必配置）
internal_token: ""

# 初始管理员账号（仅首次启动、users 表为空时生效）
admin:
  username: admin
  password: admin

# 端口分配范围
ports:
  redis:
    start: 6379
    end: 6499
  proxy_auto:
    start: 16379
    end: 16499
  proxy_master:
    start: 16500
    end: 16619

# 实例版本目录由 Server 统一维护，Agent 只执行 Server 下发的镜像
images:
  redis:
    default: "7"
    versions:
      "5": docker.io/redis:5
      "6.2": docker.io/redis:6.2
      "7": docker.io/redis:7
  kvrocks:
    default: "2.15.0"
    versions:
      "2.15.0": docker.io/apache/kvrocks:2.15.0

sentinel:
  enabled: true
  # Sentinel 是 HA 控制面，生产环境必须提前规划并显式声明节点。
  # 节点名必须来自 pool-state.yaml 的 servers key，建议 3 或 5 个，跨可用区部署。
  nodes: []
  replicas: 3
  port: 26379
  quorum: 2
  down_after_milliseconds: 5000
  failover_timeout: 30000
  parallel_syncs: 1

log:
  dir: /data/logs/redis-pilot-server    # 为空则不写文件
  stdout: true
  retention_days: 30                    # 日志保留天数，0 = 不清理

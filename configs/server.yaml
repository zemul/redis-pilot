port: 8080
token: ""
data_dir: /opt/redis-pilot-server/state

# Envoy 配置输出目录，为空则不生成
envoy_dir: /opt/envoy/conf
# 写完配置后执行的重载命令，为空则跳过
envoy_reload_cmd: "podman restart envoy"

# 端口分配范围
ports:
  redis:
    start: 6379
    end: 6499
  envoy_auto:
    start: 16379
    end: 16499
  envoy_master:
    start: 16500
    end: 16619

# 实例版本目录由 Server 统一维护，Agent 只执行 Server 下发的镜像
images:
  redis:
    default: "7"
    versions:
      "5": docker.io/redis:5
      "6.2": docker.io/redis:6.2
      "7": docker.io/redis:7
  kvrocks:
    default: "2.15.0"
    versions:
      "2.15.0": docker.io/apache/kvrocks:2.15.0

sentinel:
  enabled: true
  # Sentinel 是 HA 控制面，生产环境必须提前规划并显式声明节点。
  # 节点名必须来自 pool-state.yaml 的 servers key，建议 3 或 5 个，跨可用区部署。
  nodes: []
  replicas: 3
  port: 26379
  quorum: 2
  down_after_milliseconds: 5000
  failover_timeout: 30000
  parallel_syncs: 1

log:
  dir: /opt/redis-pilot-server/logs   # 为空则不写文件
  stdout: true
